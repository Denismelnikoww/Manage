        work_number:
          type: integer
          minimum: 1
          example: 1
        title:
          type: string
          minLength: 3
          maxLength: 255
          example: "ЛР №1: Основы работы с Git и командная разработка"
        description:
          type: string
          example: Настроить удаленный репозиторий, выполнить ветвление по Git-flow, решить merge conflict.
        deadline:
          type: string
          format: date-time
          example: 2026-11-15T23:59:59Z
        group_name:
          type: string
          example: ВПР42

    LabWorkUpdateRequest:
      type: object
      required:
        - work_number
        - title
        - description
        - deadline
      properties:
        work_number:
          type: integer
          example: 1
        title:
          type: string
          example: "ЛР №1: Основы работы с Git и ветвление"
        description:
          type: string
          example: Обновленные требования к отчету и скринам.
        deadline:
          type: string
          format: date-time
          example: 2026-11-18T23:59:59Z

    LabWorkResponse:
      type: object
      required:
        - id
        - work_number
        - title
        - description
        - deadline
        - group_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 456e4567-e89b-12d3-a456-426614174001
        work_number:
          type: integer
          example: 1
        title:
          type: string
          example: "ЛР №1: Основы Git"
        description:
          type: string
          example: Подробное методическое руководство...
        deadline:
          type: string
          format: date-time
          example: 2026-11-15T23:59:59Z
        group_name:
          type: string
          example: ВПР42
        created_at:
          type: string
          format: date-time
          example: 2026-10-27T08:00:00Z
        updated_at:
          type: string
          format: date-time
          example: 2026-10-27T08:00:00Z

    LabWorkListItemResponse:
      type: object
      required:
        - id
        - work_number
        - title
        - deadline
        - group_name
        - is_overdue
      properties:
        id:
          type: string
          format: uuid
        work_number:
          type: integer
        title:
          type: string
        deadline:
          type: string
          format: date-time
        group_name:
          type: string
        is_overdue:
          type: boolean
          example: false
        days_until_deadline:
          type: integer
          example: 5
        student_submission:
          $ref: '#/components/schemas/SubmissionShortResponse'

    SubmissionShortResponse:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        submitted_at:
          type: string
          format: date-time
          nullable: true

    SubmissionResponse:
      type: object
      required:
        - id
        - lab_work_id
        - student_id
        - student_name
        - lab_work_title
        - status
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 789e4567-e89b-12d3-a456-426614174002
        lab_work_id:
          type: string
          format: uuid
        lab_work_title:
          type: string
          example: "ЛР №1: Основы Git"
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
          example: Иванов Иван
        group_name:
          type: string
          example: ВПР42
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        file_name:
          type: string
          nullable: true
          example: LR1_Ivanov_VPR42.pdf
        file_size_bytes:
          type: integer
          nullable: true
          example: 1048576
        submitted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time

    SubmissionDetailResponse:
      allOf:
        - $ref: '#/components/schemas/SubmissionResponse'
        - type: object
          properties:
            comments:
              type: array
              items:
                $ref: '#/components/schemas/CommentResponse'

    SubmissionStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        comment_text:
          type: string
          nullable: true
          example: Не забудьте приложить отчет по лабораторной работе.
          description: Обязательно при смене статуса преподавателем на needs_work (минимум 5 символов).

    PresignedDownloadResponse:
      type: object
      required:
        - download_url
        - file_name
        - expires_in_seconds
      properties:
        download_url:
          type: string
          format: uri
          example: https://minio.local/submissions/lab1/student1/timestamp_report.pdf?X-Amz-Signature=...
        file_name:
          type: string
          example: LR1_Ivanov_VPR42.pdf
        expires_in_seconds:
          type: integer
          example: 900

    CommentCreateRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          minLength: 5
          maxLength: 2000
          example: Исправьте раздел 3, добавьте скриншот выполнения git rebase.

    CommentResponse:
      type: object
      required:
        - id
        - submission_id
        - author_id
        - author_name
        - author_role
        - text
        - created_at
      properties:
        id:
          type: string
          format: uuid
          example: a12e4567-e89b-12d3-a456-426614174003
        submission_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        author_name:
          type: string
          example: Петров Петр (Преподаватель)
        author_role:
          $ref: '#/components/schemas/UserRole'
        text:
          type: string
          example: Замечаний нет, работа защищена.
        created_at:
          type: string
          format: date-time
          example: 2026-10-28T14:30:00Z

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Некорректный формат или значение поля
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              issue:
                type: string

  responses:
    UnauthorizedError:
      description: Отсутствует или недействителен Bearer JWT токен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Требуется аутентификация в системе

    ForbiddenError:
      description: Недостаточно прав для выполнения действия (ограничение роли или чужой ресурс)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Доступ запрещен для текущей роли пользователя

    NotFoundError:
      description: Запрашиваемый ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: Запрашиваемый ресурс не существует
