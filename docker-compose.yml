# ==============================================================================
# LabFlow — Docker Compose (WBS 2.1.2)
# Поднимает изолированное локальное окружение: PostgreSQL + MinIO + FastAPI + React.
#   Frontend:  http://localhost:3000
#   Backend:   http://localhost:8000  (Swagger: /docs)
#   Postgres:  localhost:${POSTGRES_PORT:-5432}
#   MinIO:     http://localhost:9000  (консоль: http://localhost:9001)
#   docker compose up --build -d
#
# Примечание по образу MinIO: официальные образы minio/minio в текущем окружении
# недоступны (registry отвечает 403), поэтому по умолчанию используется
# bitnamilegacy/minio. Образ можно переопределить переменной MINIO_IMAGE в .env.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: labflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-labflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labflow_user} -d ${POSTGRES_DB:-labflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: ${MINIO_IMAGE:-bitnamilegacy/minio:latest}
    container_name: labflow_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET_REPORTS:-labflow-reports}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  backend:
    build:
      context: ./backend
    container_name: labflow_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-labflow_user}:${POSTGRES_PASSWORD:-labflow_secret_password}@postgres:5432/${POSTGRES_DB:-labflow_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_labflow_2026_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DEFAULT_GROUP_NAME: ${DEFAULT_GROUP_NAME:-ВПР42}
      # MinIO: внутренний адрес для операций и внешний — для подписи pre-signed URL
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_REPORTS: ${MINIO_BUCKET_REPORTS:-labflow-reports}
      MINIO_USE_SSL: "False"
      REPORT_MAX_SIZE_BYTES: ${REPORT_MAX_SIZE_BYTES:-20971520}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: labflow_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
  minio_data:
