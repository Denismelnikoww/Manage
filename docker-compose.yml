services:
  postgres:
    image: postgres:16-alpine
    container_name: labflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-labflow_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labflow_user} -d ${POSTGRES_DB:-labflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: labflow_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
