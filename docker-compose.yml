# ==============================================================================
# LabFlow — Docker Compose (WBS 2.1.2)
# Поднимает изолированное локальное окружение: PostgreSQL + FastAPI + React.
#   Frontend:  http://localhost:3000
#   Backend:   http://localhost:8000  (Swagger: /docs)
#   Postgres:  localhost:${POSTGRES_PORT:-5432}
#   docker compose up --build -d
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: labflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labflow_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-labflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labflow_user} -d ${POSTGRES_DB:-labflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: labflow_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-labflow_user}:${POSTGRES_PASSWORD:-labflow_secret_password}@postgres:5432/${POSTGRES_DB:-labflow_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_jwt_key_labflow_2026_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DEFAULT_GROUP_NAME: ${DEFAULT_GROUP_NAME:-ВПР42}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: labflow_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data: